<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI英语助手</title>


<link rel="stylesheet" href="style.css">


</head>


<body>


<div class="container">


<h1>
📚 AI英语助手 🚀
</h1>



<p>
上传英语文章，自动翻译并解析单词
</p>




<div class="upload-box">


<input
id="fileInput"
type="file"
accept=".docx"
>



<button
id="analyzeBtn"
type="button">

开始分析

</button>



</div>





<div id="result">

等待上传文件...

</div>





<div id="wordCard">


<button id="closeWord">

×

</button>



<h2 id="wordTitle">

单词

</h2>




<p id="wordMeaning">

中文：

</p>



<p id="wordExample">

例句：

</p>



</div>




</div>





<script src="app.js?v=6"></script>



</body>


</html>
